# Neo4j de teste do panorama-graph-api (bun test, `bun run test:db:up`). A instância (Neo4j de desenvolvimento,
# API e console) sobe pelo docker-compose.yml da raiz (../docker-compose.yml).
# Porta 7688 (bolt). Descartável: dados em memória, apagados entre os testes. Community só tem um banco de usuário,
# então o isolamento dos testes é uma instância separada.
name: panorama-graph-test

services:
  neo4j-test:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_TEST_PASSWORD:-testpassword}"
    ports:
      - "7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
