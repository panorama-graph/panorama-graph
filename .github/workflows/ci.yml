# Lint e testes do workspace (API, console e SDK) a cada push e pull request. No branch principal, quando o push muda a versão do
# SDK em TypeScript, envia essa versão ao npm como staged (sdks/typescript/scripts/publish.ts), por Trusted Publishing:
# sem segredo no repositório, o npm aceita o OIDC deste workflow (configurado no pacote, em npmjs.com). A versão só
# fica pública quando um mantenedor a aprova com 2FA. O disparo manual (workflow_dispatch) envia a versão atual sem
# olhar se o push a mudou, para refazer um envio que falhou.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Neo4j descartável dos testes da API (porta 7688, como o compose de api/).
      neo4j-test:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  publish-sdk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Uma versão staged ainda não aparece entre as publicadas, e o token do OIDC não lista as staged: sem este
      # filtro, todo push seguinte tentaria enviar de novo a versão que aguarda aprovação.
      - id: version
        run: |
          before="${{ github.event.before }}"
          current=$(jq -r .version sdks/typescript/package.json)
          previous=$(git show "$before:sdks/typescript/package.json" 2>/dev/null | jq -r .version || true)
          if [ "${{ github.event_name }}" = "push" ] && [ "$current" = "$previous" ]; then echo changed=false >> "$GITHUB_OUTPUT"; else echo changed=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted Publishing e `npm stage publish`.
      - if: steps.version.outputs.changed == 'true'
        run: npm install -g npm@11
      - if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.changed == 'true'
        run: bun scripts/publish.ts
        working-directory: sdks/typescript
        env:
          SDK_PUBLISH_STAGED: "true"
