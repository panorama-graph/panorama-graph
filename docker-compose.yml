# Instância do panorama-graph: Neo4j, API e console. Variáveis vêm do .env (modelo em .env.example). As imagens são
# construídas da raiz do repositório, com o Dockerfile de cada projeto. Guia: PRIMEIROS-PASSOS.md.
#   docker compose up -d --build                        Neo4j, API e console
#   docker compose up -d neo4j                          só o banco, para rodar a API com `pnpm run dev`
# Portas (mudam por variável): API 3200 (API_PORT), console 5180 (WEB_PORT), Neo4j 7474 (NEO4J_HTTP_PORT, browser) e
# 7687 (NEO4J_BOLT_PORT). O receptor dos builds, a carga à mão e a organização de exemplo sobem do repositório dos
# adaptadores (github.com/panorama-graph/adapters), apontando para esta API.
name: panorama-graph

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 3200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # O console chama a API pelo navegador: a origem dele precisa estar aqui.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-5180}}
      FROZEN_RETENTION_DAYS: ${FROZEN_RETENTION_DAYS:-30}
      DEPLOY_HISTORY_DAYS: ${DEPLOY_HISTORY_DAYS:-30}
      DEPLOY_HISTORY_DAYS_PRODUCTION: ${DEPLOY_HISTORY_DAYS_PRODUCTION:-365}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES:-60}
    ports:
      - "${API_PORT:-3200}:3200"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # O Vite embute as URLs no JS: o navegador chama a porta da API no host.
      args:
        VITE_GRAPH_API_URL: ${VITE_GRAPH_API_URL:-http://localhost:${API_PORT:-3200}}
        VITE_EVIDENCE_URL_TEMPLATE: ${VITE_EVIDENCE_URL_TEMPLATE:-}
    ports:
      - "${WEB_PORT:-5180}:5180"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j-data:
